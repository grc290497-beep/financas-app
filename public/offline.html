<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1512" />
    <title>Sem conexão · Finanças</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center; color: #eef3ef;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: radial-gradient(900px 480px at 15% -10%, rgba(40, 110, 85, 0.25), transparent 70%), #0b1512;
      }
      main { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { margin: 0; font-size: 24px; letter-spacing: -0.01em; }
      p { margin: 0; color: #a9bdb2; line-height: 1.5; }
      button {
        margin-top: 8px; width: 100%; padding: 14px 20px; border: 0; border-radius: 12px;
        font: inherit; font-weight: 600; color: #2a2210; cursor: pointer;
        background: linear-gradient(135deg, #f1dfa6 0%, #c9a65a 38%, #8a6a2c 64%, #c9a65a 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 8px 18px -8px rgba(120, 90, 30, 0.6);
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon/192" alt="Finanças" />
      <h1>Sem conexão</h1>
      <p>Você está sem internet agora. Seus dados estão salvos e aparecem assim que a conexão voltar.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
